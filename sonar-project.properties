# Análisis de SonarQube (CONSTITUTION.md, principio III; AGENTS.md §8)
sonar.projectKey=taskapisdd
sonar.projectName=TaskApiSDD
sonar.sourceEncoding=UTF-8

# Código de producción: src/ sin sus subcarpetas tests/
sonar.sources=src
sonar.exclusions=src/**/tests/**

# Tests: las subcarpetas tests/ de src/ y el soporte común de tests/
sonar.tests=src,tests
sonar.test.inclusions=src/**/tests/**,tests/**

# Cobertura de `pnpm test:coverage` (unit + integración), con rutas relativas a la raíz
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
