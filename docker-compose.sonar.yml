# Análisis estático local (CONSTITUTION.md, principio III): servidor SonarQube y scanner, sin tocar package.json.
# El servidor guarda su configuración y sus análisis en volúmenes propios (base de datos H2 embebida: uso local)
services:
  sonarqube:
    image: sonarqube:10.7.0-community
    ports:
      - "9000:9000"
    environment:
      # Docker Desktop no permite subir vm.max_map_count: se desactivan las comprobaciones de arranque de Elasticsearch
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

  # Solo se ejecuta bajo demanda: docker compose -f docker-compose.sonar.yml run --rm sonar-scanner
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:11.1
    profiles: ["scan"]
    env_file: .env.dev
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
    working_dir: /app
    volumes:
      # Misma ruta que en el contenedor api: coverage/lcov.info guarda rutas absolutas /app/...
      - .:/app
    command: ["-Dsonar.projectBaseDir=/app", "-Dsonar.qualitygate.wait=true"]
    depends_on:
      - sonarqube

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
